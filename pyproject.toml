[project]
name = "research-agent"
version = "0.1.0"
description = "本地可运行的科研 Agent 框架 — 基于 deepagents，带 Web 前端、多会话持久化、执行过程可视化、自进化 curator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "deepagents>=0.6.12",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain-openai>=1.3.5",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "python-dotenv>=1.2.2",
    "pydantic>=2.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
search = [
    "tavily-python>=0.7.26",
]

[project.scripts]
research-agent = "research_agent.cli:main"
research-agent-server = "research_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_agent"]
